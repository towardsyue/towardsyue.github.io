baseURL = "https://towardsyue.github.io/"
locale = "zh-cn"
title = "Sheayu"
theme = "PaperMod"

enableRobotsTXT = true
defaultContentLanguage = "zh-cn"

# ============================================================
# 分页
# ============================================================

[pagination]
pagerSize = 5


# ============================================================
# 输出
# ============================================================

[outputs]
home = ["HTML", "RSS", "JSON"]


# ============================================================
# 标签 / 分类
# ============================================================

[taxonomies]
tag = "tags"
category = "categories"


# ============================================================
# 网站参数
# ============================================================

[params]

# ------------------------------------------------------------
# 基础信息
# ------------------------------------------------------------

env = "production"

description = "记录 AI、LLM、软件工程、研究与成长。"
author = "Sheayu"


# ------------------------------------------------------------
# 主题
# ------------------------------------------------------------

defaultTheme = "auto"
disableThemeToggle = false

# 首页显示文章的 Section
mainSections = ["posts"]


# ------------------------------------------------------------
# 文章
# ------------------------------------------------------------

ShowReadingTime = true
ShowShareButtons = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowWordCount = true

# 显示文章摘要
hideSummary = false

# 文章目录
ShowToc = true
TocOpen = false


# ------------------------------------------------------------
# 导航栏 Logo
# ------------------------------------------------------------

[params.label]
text = "首页"


# ------------------------------------------------------------
# 首页信息
# ------------------------------------------------------------

[params.homeInfoParams]

Title = "👋 欢迎访问我的博客"

Content = """
你好，我是 **Sheayu**。

目前主要关注大模型、AI 应用开发，希望在不断实践中探索 **LLM、Agent、RAG**。

这个博客用于记录我在工作、学习与研究中的思考，分享一些技术实践、项目经验以及踩坑记录。
"""


# ------------------------------------------------------------
# 社交链接
# ------------------------------------------------------------

[[params.socialIcons]]

name = "github"
url = "https://github.com/towardsyue"


# ------------------------------------------------------------
# 搜索
# ------------------------------------------------------------

[params.fuseOpts]

isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
limit = 20

keys = [
  "title",
  "permalink",
  "summary",
  "content"
]


# ============================================================
# Markdown / 代码高亮
# ============================================================

[markup]

[markup.highlight]

noClasses = false
lineNos = false
codeFences = true
guessSyntax = true


# ============================================================
# 顶部菜单
# ============================================================

[menu]


# ------------------------------------------------------------
# 归档
# ------------------------------------------------------------

[[menu.main]]

identifier = "archives"
name = "归档"
url = "/archives/"
weight = 20


# ------------------------------------------------------------
# 搜索
# ------------------------------------------------------------

[[menu.main]]

identifier = "search"
name = "搜索"
url = "/search/"
weight = 30


# ------------------------------------------------------------
# 标签
# ------------------------------------------------------------

[[menu.main]]

identifier = "tags"
name = "标签"
url = "/tags/"
weight = 40

